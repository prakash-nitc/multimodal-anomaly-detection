# ============================================================
# CLIP Zero-Shot Baseline Configuration
# ============================================================
# Usage: python scripts/run_clip_baseline.py --config configs/clip_baseline.yaml

model:
  name: "ViT-L-14"
  pretrained: "laion2b_s32b_b82k"

data:
  # Path to MVTec AD root directory — UPDATE THIS
  root: "data/mvtec_anomaly_detection"
  batch_size: 32
  num_workers: 4

output:
  results_csv: "results/tables/clip_baseline_results.csv"
  figure_path: "results/figures/clip_baseline_auroc.png"
